[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sekimori"
version = "0.1.0"
description = "Checkpoint keeper for Matrix homeservers — admin CLI and minimal WebUI for Synapse"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kypwny" }]
keywords = ["matrix", "synapse", "homeserver", "admin", "cli", "moderation"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Systems Administration",
]
dependencies = ["bottle>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sekimori = "sekimori.cli:main"
sekimori-web = "sekimori.web:main"
sekimori-setup = "sekimori.config:main"

[project.urls]
Homepage = "https://github.com/kypwny/sekimori"
Issues = "https://github.com/kypwny/sekimori/issues"

[tool.hatch.build.targets.wheel]
packages = ["sekimori"]
